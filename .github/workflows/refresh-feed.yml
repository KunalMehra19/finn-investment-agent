name: Refresh verified filing feed
on:
  schedule:
    - cron: '15,45 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: finn-feed-writer
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install httpx PyMuPDF
      - name: Restore previous published feed
        shell: bash
        run: |
          if git fetch origin data; then
            git show FETCH_HEAD:feed.json > backend/data/live_feed.json
          fi
      - uses: actions/cache@v4
        with:
          path: backend/data/pdfs
          key: nse-pdfs-${{ github.run_id }}
          restore-keys: nse-pdfs-
      - run: python -m backend.scripts.auto_feed --once
      - name: Publish JSON on isolated data branch
        shell: bash
        run: |
          cp backend/data/live_feed.json "$RUNNER_TEMP/feed.json"
          if git rev-parse FETCH_HEAD >/dev/null 2>&1; then
            git worktree add --detach "$RUNNER_TEMP/finn-feed" FETCH_HEAD
          else
            git worktree add --detach "$RUNNER_TEMP/finn-feed" HEAD
          fi
          cd "$RUNNER_TEMP/finn-feed"
          cp "$RUNNER_TEMP/feed.json" feed.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add feed.json
          git diff --cached --quiet && exit 0
          git commit -m 'Refresh verified NSE feed'
          git push origin HEAD:refs/heads/data
