name: Verify FINN
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: python -m pip install -r backend/requirements.lock.txt
      - run: python -m pytest -q
      - run: npm test
      - run: npm run build
      - run: node scripts/build-worker.mjs
      - run: node tests/worker-smoke.mjs
